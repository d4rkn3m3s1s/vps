# /etc/needrestart/conf.d/90-fleet.conf
# ★★★2026-09-03 FLEET: needrestart HICBIR SERVISI OTOMATIK YENIDEN BASLATMASIN.
#
# 3 Eyl 06:54: unattended-upgrades libgcrypt20'yi guncelledi -> needrestart (varsayilan
# $nrconf{restart}='a') su komutu kostu:
#     systemctl restart fleet-agent waydroid@mi100 waydroid@mi11 ... (144 cihaz) docker systemd-logind
# -> 144 konteyner AYNI ANDA yeniden basladi (journal: 144 Stopping / 238 Started / 79 Scheduled
# restart) -> Linux 6.8 eventfs deadlock (101 init D-state) -> 13 cihaz 7.5 saat dustu,
# 3 cihaz "framework olu" kaldi, yeni cihaz acilamadi/silinemedi.
#
# 'l' = yalnizca LISTELE; hicbir servisi yeniden baslatma. Servis restart'lari operatorun /
# planli bakimin isidir, paket guncellemesinin degil. Kernel guncellemesi de otomatik reboot
# TETIKLEMEZ (50unattended-upgrades'te Automatic-Reboot kapali).
#
# Kurulum: install -m 644 90-fleet.conf /etc/needrestart/conf.d/90-fleet.conf
# Dogrulama: needrestart -n -r l -b  (NEEDRESTART-SVC satiri cikmamali; hicbir restart olmaz)
$nrconf{restart} = 'l';
# Ekstra guvence: filo birimleri hicbir modda dokunulmasin (0 = asla yeniden baslatma).
$nrconf{override_rc}{qr(^waydroid)} = 0;
$nrconf{override_rc}{qr(^fleet-)} = 0;
$nrconf{override_rc}{qr(^docker)} = 0;
$nrconf{override_rc}{qr(^dnsmasq)} = 0;
$nrconf{override_rc}{qr(^caddy)} = 0;
$nrconf{override_rc}{qr(^ssh)} = 0;
# Konteyner/uygulama seviyesinde de hicbir sey yeniden baslatma.
$nrconf{restart_containers} = 0 if exists $nrconf{restart_containers};
