<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!--
  ★2026-08-05 FLEET: D-Bus root baglanti limiti yukseltildi.
  SORUN: 127 cihazda kurulum "Cihaz acilisi bekleniyor"da DONUYORDU. Kok neden:
    ERROR: org.freedesktop.DBus.Error.LimitsExceeded:
    The maximum number of active connections for UID 0 has been reached
  Her Waydroid instance ~2 sistem-bus baglantisi tutuyor; varsayilan
  max_connections_per_user=256 -> 127 cihazda TAVANA carpildi (olculdu: 264/256).
  Belirti YANILTICIYDI: panel "eth0 IPv4 gecikti - DHCP re-kick" gosteriyordu,
  ama DHCP sucsuzdu — container HIC baslamadigi icin IP alacak arayuz yoktu.
  1024 ile ~500 cihaza kadar rahat pay birakiyoruz.
-->
<busconfig>
  <limit name="max_connections_per_user">1024</limit>
  <limit name="max_completed_connections">4096</limit>
</busconfig>
