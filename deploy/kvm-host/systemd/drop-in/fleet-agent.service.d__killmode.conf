[Service]
# Agent restart, wd-run.sh/weston/waydroid session child processlerini ÖLDÜRMESİN.
# Varsayılan KillMode=control-group agent cgroup undaki HERŞEYİ öldürüyor (çalışan
# cihazlar STOPPED oluyor). process = sadece ana node process i öldür, child sessionlar
# yaşamaya devam etsin (VERIFIED: agent restart mi10 sessionunu öldürüyordu).
KillMode=process
