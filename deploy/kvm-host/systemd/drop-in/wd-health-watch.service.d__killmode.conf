[Service]
# ★2026-07-29: bu oneshot servis, kurtarma sirasinda wd-proxy.sh -> redsocks
# baslatiyor. systemd'nin varsayilani (KillMode=control-group) servis bitince
# cgroup'taki TUM alt process'leri oldurur -> yeni baslatilan redsocks aninda
# olur, cihaz kopuk kalir ve script "kurtarildi" saniyordu (CANLI KANIT: mi32,
# log'da tam script bitiminde "redsocks goes down"). KillMode=process yalnizca
# ana script'i durdurur; birakilan redsocks daemon'lari yasamaya devam eder.
KillMode=process
