[Service]
# ★★★2026-08-22 KOK DUZELTME — SERVIS DUSUNCE BASLATTIGI TUM redsocks'LARI OLDURUYORDU.
# wd-proxy-restore.sh her cihaz icin bir redsocks daemon'u baslatir. Varsayilan
# KillMode=control-group oldugundan, servis HERHANGI bir sebeple durur/failed olursa
# systemd cgroup'taki TUM sureclere SIGTERM yollar -> az once baslatilan 141 redsocks
# birden olur ve 102 cihaz "disari cikamiyor" durumuna duser.
# CANLI KANIT (22 Agu 00:43:43): script isini BITIRDI ("TAMAM: 141 proxy geri-uygulandi")
# ama exit 1 dondu -> systemd failed sayip cgroup'u temizledi -> redsocks loglarinda
# "redsocks goes down" (cokme degil, SIGTERM) ve dinleyen sayisi 142 -> 40'a dustu.
# Ayni tuzak 29 Tem'de de yasanmisti (KillMode redsocks'u olduruyordu).
# KillMode=process: systemd yalnizca ANA sureci hedefler, daemon'lar ayakta kalir.
KillMode=process
