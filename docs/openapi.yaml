openapi: 3.1.0
info:
  title: VPS Android Emulator Platform API
  version: 1.0.0
  description: REST API for managing Android emulator containers and ADB jobs.
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      summary: Authenticate user and issue tokens
  /auth/refresh:
    post:
      summary: Refresh tokens
  /emulators:
    get:
      summary: List emulators
    post:
      summary: Create an emulator
  /emulators/{id}/start:
    post:
      summary: Start emulator
  /emulators/{id}/stop:
    post:
      summary: Stop emulator
  /emulators/{id}:
    delete:
      summary: Delete emulator
  /emulators/{id}/install:
    post:
      summary: Install APK on emulator
  /emulators/{id}/screenshot:
    post:
      summary: Capture emulator screenshot
  /jobs:
    get:
      summary: List jobs
  /jobs/{id}:
    get:
      summary: Get job status
  /plugins:
    get:
      summary: List plugin modules
  /plugins/{id}:
    get:
      summary: Get plugin module details
  /audit:
    get:
      summary: List recent audit events
  /system/overview:
    get:
      summary: Get system telemetry overview
  /devices:
    get:
      summary: List devices
    post:
      summary: Create a device
  /devices/quick:
    post:
      summary: Quick profile — provision a disposable cloud phone in one call
      description: >
        Multilogin-style one-call provisioning. Creates a cloud phone with a
        fresh randomized fingerprint (auto-named, tagged `quick` in metadata) and
        optionally dispatches a start job. Authenticate with an automation API
        key (x-api-key) for programmatic use.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                countryCode: { type: string, description: 2-letter country for the fingerprint }
                deviceModel: { type: string }
                androidVersion: { type: string }
                ramGb: { type: integer }
                cpuCores: { type: integer }
                autoStart: { type: boolean, description: dispatch an EMULATOR_START job }
      responses:
        '201':
          description: Created (returns { device, job? })
  /devices/{id}:
    get:
      summary: Get a device
    put:
      summary: Update a device
    delete:
      summary: Delete a device
  /devices/status/summary:
    get:
      summary: Device status summary
  /devices/{id}/heartbeat:
    post:
      summary: Update device heartbeat
  /accounts/providers/status:
    get:
      summary: Account-provider connectivity (SMS / email / identity)
  /accounts/sms/balance:
    get:
      summary: SMS provider balance (sms-bus)
  /accounts/sms/number:
    post:
      summary: Rent a disposable phone number for a service
  /accounts/sms/number/{requestId}/otp:
    get:
      summary: Read the OTP for a rented number
  /accounts/identity:
    post:
      summary: Generate a fake identity (name/address/DOB)
  /accounts/mail/inbox:
    post:
      summary: Mint a disposable email inbox
  /accounts/mail/messages:
    get:
      summary: List messages in a disposable inbox
  /accounts/batch:
    post:
      summary: Create a batch of accounts to provision (N at once)
  /accounts/batch/accounts:
    get:
      summary: List generated accounts
  /accounts/batch/accounts/{id}/provision:
    post:
      summary: Provision one account (identity + email + number)
  /accounts/batch/accounts/{id}/register:
    post:
      summary: Run on-device signup (Instagram) for one provisioned account
      description: >
        Dispatches a REGISTER_INSTAGRAM job to the chosen device. The host agent
        drives the Instagram email-signup RPA, reading the confirmation code from
        the disposable inbox. Stops and reports if it hits an SMS/captcha wall.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        '200':
          description: Registration job dispatched (account → REGISTERING)

  # ── WhatsApp Public API (x-api-key only, workspace-bound flk_ key; NO JWT) ──
  # See docs/whatsapp-api.md for the full Turkish reference. On-device POSTs are
  # asynchronous: they return { jobId, status: "PENDING" } and complete in ~10-40s.
  /public/v1/me:
    get:
      summary: Identify the calling API key (workspace, scopes, device count)
      description: >
        Self-discovery for an integration: returns the key's workspaceId, its keyId,
        label, scopes, and this workspace's device count — so a client can learn its
        own permissions (read vs write) and scale without trial-and-error 403s. Any
        valid key (read).
      security: [ { apiKeyAuth: [] } ]
      responses:
        '200':
          description: Key identity
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      workspaceId: { type: string }
                      keyId: { type: string, nullable: true }
                      label: { type: string, nullable: true }
                      scopes: { type: array, items: { type: string } }
                      deviceCount: { type: integer }
  /public/v1/devices:
    get:
      summary: List the workspace's devices (public API)
      security: [ { apiKeyAuth: [] } ]
      responses:
        '200':
          description: '{ data: [ { id, name, status } ] }'
  /public/v1/whatsapp/messages:
    get:
      summary: Stored WhatsApp message history (IN + OUT), decrypted
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: deviceId, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - { name: direction, in: query, schema: { type: string, enum: [IN, OUT] } }
      responses:
        '200':
          description: '{ data: { messages: [...] } }'
  /public/v1/whatsapp/conversations:
    get:
      summary: WhatsApp-Web-style chat list for a device
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: deviceId, in: query, required: true, schema: { type: string } }
        - { name: filter, in: query, schema: { type: string, enum: [all, unread, favorite, archived] } }
        - { name: labelId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: '{ data: { conversations: [...], nextCursor } }'
  /public/v1/whatsapp/thread:
    get:
      summary: One chat's message history (scroll-up pagination)
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: deviceId, in: query, required: true, schema: { type: string } }
        - { name: peer, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: before, in: query, schema: { type: string } }
      responses:
        '200':
          description: '{ data: { messages: [...], nextBefore } }'
  /public/v1/whatsapp/thread/read:
    post:
      summary: Mark a chat thread read — clear its unread badge (write scope)
      description: >
        Zeroes the thread's unread count and flips its unread inbound rows to read,
        exactly like opening the chat in the dashboard. Use it after an external inbox
        integration has processed a thread's new messages.
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, peer]
              properties:
                deviceId: { type: string }
                peer: { type: string, description: E.164 number or contact name }
      responses:
        '200': { description: '{ data: { ok: true } }' }
  /public/v1/whatsapp/stats:
    get:
      summary: Messaging counts + average first-response minutes
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: deviceId, in: query, schema: { type: string } }
        - { name: sinceHours, in: query, schema: { type: integer, maximum: 720 } }
      responses:
        '200':
          description: '{ data: { inbound, outbound, failed, openThreads, avgResponseMinutes } }'
  /public/v1/whatsapp/labels:
    get:
      summary: List conversation categories (labels)
      security: [ { apiKeyAuth: [] } ]
      responses:
        '200': { description: '{ data: { labels: [...] } }' }
    post:
      summary: Create a category (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 40 }
                color: { type: string }
      responses:
        '201': { description: Label created }
  /public/v1/whatsapp/send:
    post:
      summary: Send a WhatsApp message from a device (write scope)
      description: >
        Dispatches a WHATSAPP_SEND job; returns the jobId to poll via
        GET /public/v1/jobs/{jobId}. Supports an optional Idempotency-Key header — a
        retry with the SAME key returns the FIRST job instead of sending twice (the
        response then also carries idempotentReplay:true).
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 255 }
          description: >
            Opt-in dedupe key. The first request with a given key does the send and
            records its jobId; every replay with the same key returns that jobId
            without dispatching again. Bound to this endpoint — reusing it on a
            different endpoint 409s (IDEMPOTENCY_KEY_REUSED).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, to, message]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number, e.g. 90XXXXXXXXXX }
                message: { type: string, maxLength: 4096 }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING, idempotentReplay? } }' }
        '409': { description: 'Idempotency conflict — IDEMPOTENCY_KEY_REUSED or IDEMPOTENCY_IN_PROGRESS' }
  /public/v1/whatsapp/send/bulk:
    post:
      summary: Send many distinct messages in one call (write scope)
      description: >
        Up to 100 {deviceId,to,message} items in a single request. Returns one
        {to,jobId,status} per item (or {to,error,message} for items that failed to
        dispatch). Counts as one heavy operation. With an Idempotency-Key header the
        whole batch is deduped per-item (item N maps to a stable per-item key derived
        from the batch key + index), so a replay returns the SAME per-item jobIds.
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, maxLength: 255 }
          description: >
            Opt-in batch dedupe key. Each item is reserved under "<key>:<index>", so a
            retry of the same array returns the same per-item jobIds (positional).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [messages]
              properties:
                messages:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items:
                    type: object
                    required: [deviceId, to, message]
                    properties:
                      deviceId: { type: string }
                      to: { type: string, description: E.164 number }
                      message: { type: string, maxLength: 4096 }
      responses:
        '200':
          description: 'Per-item dispatch results'
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      count: { type: integer }
                      results:
                        type: array
                        items:
                          type: object
                          properties:
                            to: { type: string }
                            jobId: { type: string }
                            status: { type: string, example: PENDING }
                            idempotentReplay: { type: boolean }
                            error: { type: string, description: 'set instead of jobId when the item failed to dispatch' }
                            message: { type: string }
  /public/v1/whatsapp/broadcast:
    post:
      summary: One-to-many throttled send (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, message]
              properties:
                deviceId: { type: string }
                message: { type: string, maxLength: 4096 }
                peers: { type: array, items: { type: string }, maxItems: 1000 }
                labelId: { type: string }
      responses:
        '201': { description: '{ data: { broadcastId, queued } }' }
  /public/v1/whatsapp/profile:
    post:
      summary: Fetch a contact's profile (avatar + name) on-device (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number (to OR from required) }
                from: { type: string, description: contact display name }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } }' }
  /public/v1/whatsapp/block:
    post:
      summary: Block / unblock a contact on-device (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number (to OR from required) }
                from: { type: string }
                block: { type: boolean, description: 'true = block (default), false = unblock' }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } }' }
  /public/v1/whatsapp/blocklist:
    post:
      summary: Read the device's blocked-accounts list (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } } — result: { count, blocked: [...] }' }
  /public/v1/whatsapp/mynumber:
    post:
      summary: Read the account's own WhatsApp number on-device (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } } — result: { number }' }
  /public/v1/whatsapp/send-media:
    post:
      summary: Send an image/document from a URL (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, to, mediaUrl]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number }
                mediaUrl: { type: string, format: uri, maxLength: 2048 }
                caption: { type: string, maxLength: 1024 }
                kind: { type: string, enum: [image, document] }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } }' }
  /public/v1/whatsapp/delete-message:
    post:
      summary: Delete a message (for me / for everyone) (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, to]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number }
                scope: { type: string, enum: [me, everyone], description: 'default: everyone' }
                matchText: { type: string, description: target a specific message by text }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } }' }
  /public/v1/whatsapp/clear-chat:
    post:
      summary: Clear a chat's local history (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, to]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } }' }
  /public/v1/whatsapp/receipts:
    post:
      summary: Per-message delivery/read receipts for a chat, from msgstore.db (write scope, root-DB, zero ban risk)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, to]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number }
                limit: { type: integer, minimum: 1, maximum: 100, description: 'default: 20' }
      responses:
        '200': { description: '{ data: { jobId, status } } — result: { count, receipts: [{ ts, status: SENT|DELIVERED|READ, text }] }' }
  /public/v1/whatsapp/media:
    post:
      summary: Media inventory for a chat (or whole device), from message_media (write scope, root-DB)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
                to: { type: string, description: 'E.164 number (omit for whole device)' }
                limit: { type: integer, minimum: 1, maximum: 200, description: 'default: 50' }
      responses:
        '200': { description: '{ data: { jobId, status } } — result: { count, media: [{ ts, fromMe, mime, name, size, caption, path }] }' }
  /public/v1/whatsapp/calls:
    post:
      summary: WhatsApp call log (voice/video, in/out/missed), from call_log (write scope, root-DB)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
                limit: { type: integer, minimum: 1, maximum: 200, description: 'default: 50' }
      responses:
        '200': { description: '{ data: { jobId, status } } — result: { count, calls: [{ ts, fromMe, video, durationSec, result }] }' }
  /public/v1/whatsapp/search:
    post:
      summary: Full-text search across all of the account''s messages (write scope, root-DB)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, query]
              properties:
                deviceId: { type: string }
                query: { type: string, minLength: 1, maxLength: 100 }
                limit: { type: integer, minimum: 1, maximum: 200, description: 'default: 50' }
      responses:
        '200': { description: '{ data: { jobId, status } } — result: { count, results: [{ ts, fromMe, peer, text }] }' }
  /public/v1/whatsapp/unread:
    post:
      summary: Total unread messages + unread chat count, from chat.unseen_message_count (write scope, root-DB)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        '200': { description: '{ data: { jobId, status } } — result: { totalUnread, unreadChats }' }
  /public/v1/whatsapp/contacts:
    post:
      summary: Full WhatsApp address book (number + display name), from wa.db (write scope, root-DB)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
                limit: { type: integer, minimum: 1, maximum: 500, description: 'default: 200' }
      responses:
        '200': { description: '{ data: { jobId, status } } — result: { count, contacts: [{ number, name }] }' }
  /public/v1/whatsapp/group-members:
    post:
      summary: Members of a group chat (by subject or jid id), from msgstore.db (write scope, root-DB)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, group]
              properties:
                deviceId: { type: string }
                group: { type: string, minLength: 1, maxLength: 120, description: group subject (name) or jid number }
                limit: { type: integer, minimum: 1, maximum: 1000, description: 'default: 500' }
      responses:
        '200': { description: '{ data: { jobId, status } } — result: { count, members: [{ number, admin }] }' }
  /public/v1/whatsapp/chat-summary:
    post:
      summary: One chat''s aggregate stats (message/media counts, first/last ts), from msgstore.db (write scope, root-DB)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, to]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number }
      responses:
        '200': { description: '{ data: { jobId, status } } — result: { total, inbound, outbound, media, firstTs, lastTs }' }
  /public/v1/whatsapp/account-health:
    post:
      summary: Device account health — registered number + WhatsApp version + registered flag (write scope, root-DB)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        '200': { description: '{ data: { jobId, status } } — result: { number, waVersion, registered }' }
  /public/v1/whatsapp/conversations/labels:
    post:
      summary: Assign categories to a chat (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, peer, labelIds]
              properties:
                deviceId: { type: string }
                peer: { type: string }
                labelIds: { type: array, items: { type: string }, maxItems: 20 }
      responses:
        '200': { description: '{ data: { ok: true } }' }
  /public/v1/whatsapp/conversations/state:
    post:
      summary: Favourite / archive / pin a chat (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, peer]
              properties:
                deviceId: { type: string }
                peer: { type: string }
                favorite: { type: boolean }
                archived: { type: boolean }
                pinned: { type: boolean }
      responses:
        '200': { description: '{ data: { ok: true } }' }

  # ── One-click provision + WhatsApp autonomous registration (write scope, heavily
  # throttled). Async, two-phase: register drives to the SMS screen and parks
  # (AWAITING_OTP); submit the code to /register/{id}/otp to finish. Poll the
  # matching /status endpoint (same data as the dashboard's live modal). ──
  /public/v1/devices/provision:
    post:
      summary: One-click provision — build a brand-new isolated cloud phone (write scope)
      description: >
        Spins up a fresh Waydroid instance from scratch (boot → root → unique
        identity → country-matched proxy → apps → WhatsApp-ready), exactly like the
        dashboard's "Tek Tıkla Cihaz Oluştur". Async: returns immediately with the
        deviceId + jobId; poll GET /public/v1/devices/provision/{jobId}/status until
        it comes online. Heavy operation → strictly rate-limited (per API key).
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60, description: device name (blank → auto "Cihaz miN") }
                countryCode: { type: string, minLength: 2, maxLength: 2, description: fingerprint country (ISO-2, e.g. US) }
                deviceModel: { type: string, maxLength: 60, description: catalog model (e.g. Samsung Galaxy S21) }
                androidVersion: { type: string, maxLength: 10, description: Android version (e.g. 13) }
                proxyCountry: { type: string, minLength: 2, maxLength: 2, description: country-matched residential proxy (ISO-2; WhatsApp needs number-country == exit-IP country) }
      responses:
        '201':
          description: Provisioning started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProvisionResponse'
  /public/v1/devices/provision/{jobId}/status:
    get:
      summary: Live step-by-step provision progress
      description: >
        Same data the dashboard's live install modal shows — phase, percent, current
        step and full step log. Poll every few seconds. Any valid key (read).
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Provision status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProvisionStatusResponse'
  /public/v1/whatsapp/register:
    post:
      summary: One-click WhatsApp autonomous registration (write scope)
      description: >
        Starts an autonomous WhatsApp signup on a device with the caller's OWN
        number. The agent grants permissions, accepts the EULA, enters the number and
        parks on the SMS-code screen (status AWAITING_OTP). Submit the code to
        /register/{id}/otp to finish. A country-matched residential proxy is
        auto-attached when available. Heavy operation → strictly rate-limited (per API key).
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, phoneNumber]
              properties:
                deviceId: { type: string, description: online device with a live agent }
                phoneNumber: { type: string, description: E.164 with country code, e.g. +15551234567 }
      responses:
        '201':
          description: Registration started (account → REGISTERING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRegisterResponse'
  /public/v1/whatsapp/register/{id}/otp:
    post:
      summary: Submit the SMS verification code (write scope)
      description: >
        id = accountId from the register response. Forwards the code to the agent,
        which enters it and finishes the profile. Account flips to ACTIVE or FAILED.
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [otpCode]
              properties:
                otpCode: { type: string, minLength: 4, maxLength: 8 }
      responses:
        '200':
          description: Code accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRegisterAccountResponse'
  /public/v1/whatsapp/register/{id}/verify-method:
    post:
      summary: Pick the verification method when parked on the "Choose how to verify" sheet (write scope)
      description: >
        id = accountId. Used when registration parks on WhatsApp's method sheet
        (status AWAITING_OTP with phase method_select). The agent applies the choice
        and continues to the code step.
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [sms, voice, missed_call] }
      responses:
        '200':
          description: Method applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRegisterAccountResponse'
  /public/v1/whatsapp/register/{id}/status:
    get:
      summary: Live WhatsApp registration progress
      description: >
        id = accountId. Live step-by-step progress (current step, percent, full step
        log) — the same data as the dashboard modal. Poll every few seconds. Any valid
        key (read).
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Registration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRegisterStatusResponse'
  /public/v1/jobs/{jobId}:
    get:
      summary: Read the result/status of any on-device job (read)
      description: >
        Universal poll target for the jobId every on-device write endpoint returns
        (send, broadcast, profile, block, blocklist, mynumber, send-media,
        delete-message, clear-chat). status flows PENDING → RUNNING → COMPLETED (or
        FAILED); the outcome lands on result. Any valid key (read). Workspace-scoped —
        a foreign jobId 404s (JOB_NOT_FOUND). The job payload is deliberately NOT
        returned (it can hold decrypted identity/proxy secrets).
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job status + result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJobResponse'
        '404':
          description: '{ error: JOB_NOT_FOUND }'
  /public/v1/jobs/{jobId}/wait:
    get:
      summary: Long-poll a job until it finishes or the timeout elapses (read)
      description: >
        Like GET /public/v1/jobs/{jobId}, but blocks server-side until the job
        reaches a terminal state (COMPLETED / FAILED / CANCELLED) or ?timeout
        seconds elapse — turning the integrator's poll loop into ONE request. If it
        finishes first, the body matches GET /jobs/{jobId}. If the timeout hits, the
        current (still PENDING/RUNNING) job is returned with timedOut:true so the
        caller can wait again. Any valid key (read). Workspace-scoped.
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
        - name: timeout
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 60 }
          description: 'Seconds to wait (default 30). Clamped to [1,60].'
      responses:
        '200':
          description: Job status + result (with timedOut:true if the wait elapsed first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJobResponse'
        '404':
          description: '{ error: JOB_NOT_FOUND }'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    # ── Public one-click provision / registration / job schemas ──
    PublicProvisionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            deviceId: { type: string }
            jobId: { type: string }
            instance: { type: string, description: 'Waydroid instance name (e.g. mi8)' }
            status: { type: string, example: PROVISIONING }
    PublicProvisionStatusResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            jobId: { type: string }
            deviceId: { type: string }
            status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
            phase: { type: string, enum: [provisioning, ready, failed] }
            percent: { type: integer }
            lastProgress:
              type: object
              properties:
                step: { type: string }
                percent: { type: integer }
                status: { type: string }
                note: { type: string }
            steps:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  label: { type: string }
                  percent: { type: integer }
            log:
              type: array
              items:
                type: object
    PublicRegisterResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accountId: { type: string }
            deviceId: { type: string }
            phoneNumber: { type: string }
            status: { type: string, example: REGISTERING }
            proxyAssigned:
              type: object
              description: 'Country-matched proxy attached for this number (when available).'
              properties:
                country: { type: string, description: 'ISO-2 exit country (e.g. US)' }
    PublicRegisterAccountResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [REGISTERING, AWAITING_OTP, ACTIVE, FAILED] }
            phoneNumber: { type: string }
    PublicRegisterStatusResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accountId: { type: string }
            deviceId: { type: string }
            status: { type: string, enum: [REGISTERING, AWAITING_OTP, ACTIVE, FAILED] }
            phase: { type: string, enum: [starting, waiting_phone, waiting_sms, method_select, opened, failed] }
            percent: { type: integer }
            lastProgress:
              type: object
              properties:
                step: { type: string }
                percent: { type: integer }
                status: { type: string }
                note: { type: string }
            steps:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  label: { type: string }
                  percent: { type: integer }
            log:
              type: array
              items:
                type: object
    PublicJobResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string }
            type: { type: string, description: 'Job type, e.g. WHATSAPP_MYNUMBER / WHATSAPP_BLOCKLIST' }
            status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
            result:
              description: 'Outcome when COMPLETED (shape varies by type), else null. e.g. mynumber → { status, number }; blocklist → { status, count, blocked }.'
              nullable: true
              type: object
            error: { type: string, nullable: true, description: 'Failure reason when FAILED, else null.' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }

    # ── Webhook event catalog ──
    # The set of events a workspace webhook (created in the dashboard under
    # Settings › Webhooks, or via the admin API) can subscribe to. A webhook fires a
    # POST to its URL with a WebhookEnvelope body when a matching event occurs.
    # Subscribe to a single event or to 'ALL'. Workspace-scoped: an event only reaches
    # that workspace's hooks. Must stay in sync with the Prisma WebhookEvent enum +
    # webhooks.controller.WEBHOOK_EVENTS.
    WebhookEvent:
      type: string
      description: >
        Subscribable webhook events. 'ALL' is a subscribe-to-everything filter, never
        an emitted event value.
      enum:
        - JOB_COMPLETED           # any on-device job finished OK      → { jobId, jobType }
        - JOB_FAILED              # any on-device job failed           → { jobId, jobType, error }
        - DEVICE_ONLINE           # a device transitioned to ONLINE    → { deviceId, name }
        - DEVICE_OFFLINE          # a device went OFFLINE
        - DEVICE_PROVISIONED      # one-click provision finished       → { deviceId, ipAddress, adbPort, instance }
        - QUOTA_HIGH              # usage quota threshold crossed
        - ALERT_FIRED             # an alert rule fired
        - WHATSAPP_MESSAGE        # inbound WhatsApp message captured   → { deviceId, deviceName, messageId, from, text, ts }
        - WHATSAPP_SENT           # outbound message left the device    → { deviceId, to, messageId, status:SENT, ts }
        - WHATSAPP_FAILED         # outbound message failed             → { deviceId, to, status:FAILED, failReason, ts }
        - WHATSAPP_DELIVERED      # outbound ✓✓ delivered on peer phone → { deviceId, to, messageId, status:DELIVERED, ts }  (agent tick-read is a TODO)
        - WHATSAPP_READ           # outbound blue-tick read             → { deviceId, to, messageId, status:READ, ts }        (agent tick-read is a TODO)
        - WHATSAPP_AWAITING_OTP   # registration parked for a code/method → { accountId, deviceId, phoneNumber, status }
        - WHATSAPP_REGISTERED     # registration reached ACTIVE          → { accountId, deviceId, phoneNumber, status }
        - WHATSAPP_REGISTER_FAILED# registration failed                  → { accountId, deviceId, phoneNumber, status, error }
        - ALL                     # subscribe to every event above
    WebhookEnvelope:
      type: object
      description: The JSON body POSTed to a webhook URL when a subscribed event fires.
      properties:
        event:
          $ref: '#/components/schemas/WebhookEvent'
          description: The concrete event that fired (never 'ALL').
        firedAt: { type: string, format: date-time }
        data:
          type: object
          description: Event-specific payload (see the per-event shapes on WebhookEvent).
security:
  - bearerAuth: []
  - apiKeyAuth: []
externalDocs:
  description: WebSocket stream for live device events
  url: ws://localhost:4000/ws/devices
