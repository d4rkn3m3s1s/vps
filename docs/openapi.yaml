openapi: 3.1.0
info:
  title: VPS Android Emulator Platform API
  version: 1.0.0
  description: REST API for managing Android emulator containers and ADB jobs.
servers:
  - url: http://localhost:4000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
  /auth/login:
    post:
      summary: Authenticate user and issue tokens
  /auth/refresh:
    post:
      summary: Refresh tokens
  /emulators:
    get:
      summary: List emulators
    post:
      summary: Create an emulator
  /emulators/{id}/start:
    post:
      summary: Start emulator
  /emulators/{id}/stop:
    post:
      summary: Stop emulator
  /emulators/{id}:
    delete:
      summary: Delete emulator
  /emulators/{id}/install:
    post:
      summary: Install APK on emulator
  /emulators/{id}/screenshot:
    post:
      summary: Capture emulator screenshot
  /jobs:
    get:
      summary: List jobs
  /jobs/{id}:
    get:
      summary: Get job status
  /plugins:
    get:
      summary: List plugin modules
  /plugins/{id}:
    get:
      summary: Get plugin module details
  /audit:
    get:
      summary: List recent audit events
  /system/overview:
    get:
      summary: Get system telemetry overview
  /devices:
    get:
      summary: List devices
    post:
      summary: Create a device
  /devices/quick:
    post:
      summary: Quick profile — provision a disposable cloud phone in one call
      description: >
        Multilogin-style one-call provisioning. Creates a cloud phone with a
        fresh randomized fingerprint (auto-named, tagged `quick` in metadata) and
        optionally dispatches a start job. Authenticate with an automation API
        key (x-api-key) for programmatic use.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                countryCode: { type: string, description: 2-letter country for the fingerprint }
                deviceModel: { type: string }
                androidVersion: { type: string }
                ramGb: { type: integer }
                cpuCores: { type: integer }
                autoStart: { type: boolean, description: dispatch an EMULATOR_START job }
      responses:
        '201':
          description: Created (returns { device, job? })
  /devices/{id}:
    get:
      summary: Get a device
    put:
      summary: Update a device
    delete:
      summary: Delete a device
  /devices/status/summary:
    get:
      summary: Device status summary
  /devices/{id}/heartbeat:
    post:
      summary: Update device heartbeat
  /accounts/providers/status:
    get:
      summary: Account-provider connectivity (SMS / email / identity)
  /accounts/sms/balance:
    get:
      summary: SMS provider balance (sms-bus)
  /accounts/sms/number:
    post:
      summary: Rent a disposable phone number for a service
  /accounts/sms/number/{requestId}/otp:
    get:
      summary: Read the OTP for a rented number
  /accounts/identity:
    post:
      summary: Generate a fake identity (name/address/DOB)
  /accounts/mail/inbox:
    post:
      summary: Mint a disposable email inbox
  /accounts/mail/messages:
    get:
      summary: List messages in a disposable inbox
  /accounts/batch:
    post:
      summary: Create a batch of accounts to provision (N at once)
  /accounts/batch/accounts:
    get:
      summary: List generated accounts
  /accounts/batch/accounts/{id}/provision:
    post:
      summary: Provision one account (identity + email + number)
  /accounts/batch/accounts/{id}/register:
    post:
      summary: Run on-device signup (Instagram) for one provisioned account
      description: >
        Dispatches a REGISTER_INSTAGRAM job to the chosen device. The host agent
        drives the Instagram email-signup RPA, reading the confirmation code from
        the disposable inbox. Stops and reports if it hits an SMS/captcha wall.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        '200':
          description: Registration job dispatched (account → REGISTERING)

  # ── WhatsApp Public API (x-api-key only, workspace-bound flk_ key; NO JWT) ──
  # See docs/whatsapp-api.md for the full Turkish reference. On-device POSTs are
  # asynchronous: they return { jobId, status: "PENDING" } and complete in ~10-40s.
  /public/v1/devices:
    get:
      summary: List the workspace's devices (public API)
      security: [ { apiKeyAuth: [] } ]
      responses:
        '200':
          description: '{ data: [ { id, name, status } ] }'
  /public/v1/whatsapp/messages:
    get:
      summary: Stored WhatsApp message history (IN + OUT), decrypted
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: deviceId, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 500 } }
        - { name: direction, in: query, schema: { type: string, enum: [IN, OUT] } }
      responses:
        '200':
          description: '{ data: { messages: [...] } }'
  /public/v1/whatsapp/conversations:
    get:
      summary: WhatsApp-Web-style chat list for a device
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: deviceId, in: query, required: true, schema: { type: string } }
        - { name: filter, in: query, schema: { type: string, enum: [all, unread, favorite, archived] } }
        - { name: labelId, in: query, schema: { type: string } }
        - { name: search, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        '200':
          description: '{ data: { conversations: [...], nextCursor } }'
  /public/v1/whatsapp/thread:
    get:
      summary: One chat's message history (scroll-up pagination)
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: deviceId, in: query, required: true, schema: { type: string } }
        - { name: peer, in: query, required: true, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, maximum: 200 } }
        - { name: before, in: query, schema: { type: string } }
      responses:
        '200':
          description: '{ data: { messages: [...], nextBefore } }'
  /public/v1/whatsapp/stats:
    get:
      summary: Messaging counts + average first-response minutes
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: deviceId, in: query, schema: { type: string } }
        - { name: sinceHours, in: query, schema: { type: integer, maximum: 720 } }
      responses:
        '200':
          description: '{ data: { inbound, outbound, failed, openThreads, avgResponseMinutes } }'
  /public/v1/whatsapp/labels:
    get:
      summary: List conversation categories (labels)
      security: [ { apiKeyAuth: [] } ]
      responses:
        '200': { description: '{ data: { labels: [...] } }' }
    post:
      summary: Create a category (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 40 }
                color: { type: string }
      responses:
        '201': { description: Label created }
  /public/v1/whatsapp/send:
    post:
      summary: Send a WhatsApp message from a device (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, to, message]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number, e.g. 90XXXXXXXXXX }
                message: { type: string, maxLength: 4096 }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } }' }
  /public/v1/whatsapp/broadcast:
    post:
      summary: One-to-many throttled send (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, message]
              properties:
                deviceId: { type: string }
                message: { type: string, maxLength: 4096 }
                peers: { type: array, items: { type: string }, maxItems: 1000 }
                labelId: { type: string }
      responses:
        '201': { description: '{ data: { broadcastId, queued } }' }
  /public/v1/whatsapp/profile:
    post:
      summary: Fetch a contact's profile (avatar + name) on-device (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number (to OR from required) }
                from: { type: string, description: contact display name }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } }' }
  /public/v1/whatsapp/block:
    post:
      summary: Block / unblock a contact on-device (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number (to OR from required) }
                from: { type: string }
                block: { type: boolean, description: 'true = block (default), false = unblock' }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } }' }
  /public/v1/whatsapp/blocklist:
    post:
      summary: Read the device's blocked-accounts list (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } } — result: { count, blocked: [...] }' }
  /public/v1/whatsapp/mynumber:
    post:
      summary: Read the account's own WhatsApp number on-device (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { type: string }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } } — result: { number }' }
  /public/v1/whatsapp/send-media:
    post:
      summary: Send an image/document from a URL (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, to, mediaUrl]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number }
                mediaUrl: { type: string, format: uri, maxLength: 2048 }
                caption: { type: string, maxLength: 1024 }
                kind: { type: string, enum: [image, document] }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } }' }
  /public/v1/whatsapp/delete-message:
    post:
      summary: Delete a message (for me / for everyone) (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, to]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number }
                scope: { type: string, enum: [me, everyone], description: 'default: everyone' }
                matchText: { type: string, description: target a specific message by text }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } }' }
  /public/v1/whatsapp/clear-chat:
    post:
      summary: Clear a chat's local history (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, to]
              properties:
                deviceId: { type: string }
                to: { type: string, description: E.164 number }
      responses:
        '200': { description: '{ data: { jobId, status: PENDING } }' }
  /public/v1/whatsapp/conversations/labels:
    post:
      summary: Assign categories to a chat (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, peer, labelIds]
              properties:
                deviceId: { type: string }
                peer: { type: string }
                labelIds: { type: array, items: { type: string }, maxItems: 20 }
      responses:
        '200': { description: '{ data: { ok: true } }' }
  /public/v1/whatsapp/conversations/state:
    post:
      summary: Favourite / archive / pin a chat (write scope)
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, peer]
              properties:
                deviceId: { type: string }
                peer: { type: string }
                favorite: { type: boolean }
                archived: { type: boolean }
                pinned: { type: boolean }
      responses:
        '200': { description: '{ data: { ok: true } }' }

  # ── One-click provision + WhatsApp autonomous registration (write scope, heavily
  # throttled). Async, two-phase: register drives to the SMS screen and parks
  # (AWAITING_OTP); submit the code to /register/{id}/otp to finish. Poll the
  # matching /status endpoint (same data as the dashboard's live modal). ──
  /public/v1/devices/provision:
    post:
      summary: One-click provision — build a brand-new isolated cloud phone (write scope)
      description: >
        Spins up a fresh Waydroid instance from scratch (boot → root → unique
        identity → country-matched proxy → apps → WhatsApp-ready), exactly like the
        dashboard's "Tek Tıkla Cihaz Oluştur". Async: returns immediately with the
        deviceId + jobId; poll GET /public/v1/devices/provision/{jobId}/status until
        it comes online. Heavy operation → strictly rate-limited (per API key).
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60, description: device name (blank → auto "Cihaz miN") }
                countryCode: { type: string, minLength: 2, maxLength: 2, description: fingerprint country (ISO-2, e.g. US) }
                deviceModel: { type: string, maxLength: 60, description: catalog model (e.g. Samsung Galaxy S21) }
                androidVersion: { type: string, maxLength: 10, description: Android version (e.g. 13) }
                proxyCountry: { type: string, minLength: 2, maxLength: 2, description: country-matched residential proxy (ISO-2; WhatsApp needs number-country == exit-IP country) }
      responses:
        '201':
          description: Provisioning started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProvisionResponse'
  /public/v1/devices/provision/{jobId}/status:
    get:
      summary: Live step-by-step provision progress
      description: >
        Same data the dashboard's live install modal shows — phase, percent, current
        step and full step log. Poll every few seconds. Any valid key (read).
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Provision status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProvisionStatusResponse'
  /public/v1/whatsapp/register:
    post:
      summary: One-click WhatsApp autonomous registration (write scope)
      description: >
        Starts an autonomous WhatsApp signup on a device with the caller's OWN
        number. The agent grants permissions, accepts the EULA, enters the number and
        parks on the SMS-code screen (status AWAITING_OTP). Submit the code to
        /register/{id}/otp to finish. A country-matched residential proxy is
        auto-attached when available. Heavy operation → strictly rate-limited (per API key).
      security: [ { apiKeyAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, phoneNumber]
              properties:
                deviceId: { type: string, description: online device with a live agent }
                phoneNumber: { type: string, description: E.164 with country code, e.g. +15551234567 }
      responses:
        '201':
          description: Registration started (account → REGISTERING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRegisterResponse'
  /public/v1/whatsapp/register/{id}/otp:
    post:
      summary: Submit the SMS verification code (write scope)
      description: >
        id = accountId from the register response. Forwards the code to the agent,
        which enters it and finishes the profile. Account flips to ACTIVE or FAILED.
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [otpCode]
              properties:
                otpCode: { type: string, minLength: 4, maxLength: 8 }
      responses:
        '200':
          description: Code accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRegisterAccountResponse'
  /public/v1/whatsapp/register/{id}/verify-method:
    post:
      summary: Pick the verification method when parked on the "Choose how to verify" sheet (write scope)
      description: >
        id = accountId. Used when registration parks on WhatsApp's method sheet
        (status AWAITING_OTP with phase method_select). The agent applies the choice
        and continues to the code step.
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [sms, voice, missed_call] }
      responses:
        '200':
          description: Method applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRegisterAccountResponse'
  /public/v1/whatsapp/register/{id}/status:
    get:
      summary: Live WhatsApp registration progress
      description: >
        id = accountId. Live step-by-step progress (current step, percent, full step
        log) — the same data as the dashboard modal. Poll every few seconds. Any valid
        key (read).
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Registration status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicRegisterStatusResponse'
  /public/v1/jobs/{jobId}:
    get:
      summary: Read the result/status of any on-device job (read)
      description: >
        Universal poll target for the jobId every on-device write endpoint returns
        (send, broadcast, profile, block, blocklist, mynumber, send-media,
        delete-message, clear-chat). status flows PENDING → RUNNING → COMPLETED (or
        FAILED); the outcome lands on result. Any valid key (read). Workspace-scoped —
        a foreign jobId 404s (JOB_NOT_FOUND). The job payload is deliberately NOT
        returned (it can hold decrypted identity/proxy secrets).
      security: [ { apiKeyAuth: [] } ]
      parameters:
        - { name: jobId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Job status + result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicJobResponse'
        '404':
          description: '{ error: JOB_NOT_FOUND }'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    # ── Public one-click provision / registration / job schemas ──
    PublicProvisionResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            deviceId: { type: string }
            jobId: { type: string }
            instance: { type: string, description: 'Waydroid instance name (e.g. mi8)' }
            status: { type: string, example: PROVISIONING }
    PublicProvisionStatusResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            jobId: { type: string }
            deviceId: { type: string }
            status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
            phase: { type: string, enum: [provisioning, ready, failed] }
            percent: { type: integer }
            lastProgress:
              type: object
              properties:
                step: { type: string }
                percent: { type: integer }
                status: { type: string }
                note: { type: string }
            steps:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  label: { type: string }
                  percent: { type: integer }
            log:
              type: array
              items:
                type: object
    PublicRegisterResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accountId: { type: string }
            deviceId: { type: string }
            phoneNumber: { type: string }
            status: { type: string, example: REGISTERING }
            proxyAssigned:
              type: object
              description: 'Country-matched proxy attached for this number (when available).'
              properties:
                country: { type: string, description: 'ISO-2 exit country (e.g. US)' }
    PublicRegisterAccountResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string }
            status: { type: string, enum: [REGISTERING, AWAITING_OTP, ACTIVE, FAILED] }
            phoneNumber: { type: string }
    PublicRegisterStatusResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            accountId: { type: string }
            deviceId: { type: string }
            status: { type: string, enum: [REGISTERING, AWAITING_OTP, ACTIVE, FAILED] }
            phase: { type: string, enum: [starting, waiting_phone, waiting_sms, method_select, opened, failed] }
            percent: { type: integer }
            lastProgress:
              type: object
              properties:
                step: { type: string }
                percent: { type: integer }
                status: { type: string }
                note: { type: string }
            steps:
              type: array
              items:
                type: object
                properties:
                  key: { type: string }
                  label: { type: string }
                  percent: { type: integer }
            log:
              type: array
              items:
                type: object
    PublicJobResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id: { type: string }
            type: { type: string, description: 'Job type, e.g. WHATSAPP_MYNUMBER / WHATSAPP_BLOCKLIST' }
            status: { type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED] }
            result:
              description: 'Outcome when COMPLETED (shape varies by type), else null. e.g. mynumber → { status, number }; blocklist → { status, count, blocked }.'
              nullable: true
              type: object
            error: { type: string, nullable: true, description: 'Failure reason when FAILED, else null.' }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
security:
  - bearerAuth: []
  - apiKeyAuth: []
externalDocs:
  description: WebSocket stream for live device events
  url: ws://localhost:4000/ws/devices
